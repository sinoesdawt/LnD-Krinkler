
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOTTIES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0912;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292039}
.logo{font-size:28px;font-weight:900;color:#c084fc;letter-spacing:2px}
button{border:0;border-radius:9px;padding:12px 18px;background:linear-gradient(90deg,#9333ea,#ec4899);color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
input{width:100%;padding:14px;margin:8px 0;background:#171321;border:1px solid #49345f;border-radius:8px;color:white}
main{max-width:1100px;margin:50px auto;padding:20px}
h1{font-size:38px}
.muted{color:#aaa}
.panel{background:#15111f;border:1px solid #38264d;border-radius:16px;padding:25px;margin:20px 0}
.auth{max-width:420px;margin:60px auto}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1}
.hidden{display:none!important}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.game{background:#191423;border:1px solid #39294d;border-radius:13px;overflow:hidden}
.game img{width:100%;height:140px;object-fit:cover;background:#241b31}
.game div{padding:15px}
.game h3{margin:0 0 12px}
#message{color:#f0abfc;min-height:22px}
.owner{border-color:#a855f7}
</style>
</head>
<body>
<header>
  <div class="logo">DOTTIES</div>
  <div>
    <span id="userLabel" class="muted"></span>
    <button id="logoutBtn" class="hidden" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <section id="authSection" class="auth panel">
    <h1>Welcome to DOTTIES</h1>
    <p class="muted">Sign in or create an account to explore games.</p>
    <div class="tabs">
      <button onclick="showTab('login')">Log in</button>
      <button onclick="showTab('signup')">Sign up</button>
    </div>
    <div id="loginForm">
      <input id="loginUsername" placeholder="Username" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button style="width:100%" onclick="login()">Log in</button>
    </div>
    <div id="signupForm" class="hidden">
      <input id="signupUsername" placeholder="Choose a username" autocomplete="username">
      <input id="signupPassword" type="password" placeholder="Choose a password" autocomplete="new-password">
      <button style="width:100%" onclick="signup()">Create account</button>
    </div>
    <p id="message"></p>
  </section>

  <section id="appSection" class="hidden">
    <h1>Explore Games</h1>
    <p class="muted">Find something fun to play.</p>

    <section id="ownerPanel" class="panel owner hidden">
      <h2>Owner Dashboard</h2>
      <p class="muted">Owner account: HorizionDawt</p>
      <h3>Publish a game</h3>
      <input id="gameTitle" placeholder="Game title">
      <input id="gameUrl" placeholder="Game link (https://...)">
      <input id="gameImage" placeholder="Image URL (optional)">
      <button onclick="publishGame()">Publish game</button>
      <p id="ownerMessage"></p>
    </section>

    <div id="games" class="games"></div>
    <p id="gamesMessage" class="muted"></p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://vlkidgwzkbodmpxwquqf.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let currentProfile = null;

function showTab(tab){
  document.getElementById("loginForm").classList.toggle("hidden",tab!=="login");
  document.getElementById("signupForm").classList.toggle("hidden",tab!=="signup");
  document.getElementById("message").textContent="";
}

function usernameEmail(username){
  return username.trim().toLowerCase()+"@dotties.invalid";
}

async function signup(){
  const username=document.getElementById("signupUsername").value.trim();
  const password=document.getElementById("signupPassword").value;
  const message=document.getElementById("message");

  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){
    message.textContent="Username must be 3–20 letters, numbers, or underscores.";
    return;
  }
  if(password.length<8){
    message.textContent="Password must be at least 8 characters.";
    return;
  }

  message.textContent="Creating your account...";
  const {data,error}=await db.auth.signUp({
    email:usernameEmail(username),
    password,
    options:{data:{username}}
  });

  if(error){message.textContent=error.message;return;}
  message.textContent="Account created. If email confirmation is enabled, finish the confirmation step before logging in.";
  if(data.session) await loadApp();
}

async function login(){
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value;
  const message=document.getElementById("message");

  message.textContent="Logging in...";
  const {error}=await db.auth.signInWithPassword({
    email:usernameEmail(username),
    password
  });

  if(error){message.textContent=error.message;return;}
  await loadApp();
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  currentProfile=null;
  document.getElementById("appSection").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  document.getElementById("userLabel").textContent="";
}

async function loadApp(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return;
  currentUser=user;

  const {data:profile,error}=await db.from("profiles")
    .select("username, role")
    .eq("id",user.id)
    .single();

  if(error){
    document.getElementById("message").textContent=
      "Your account is signed in, but the profiles database setup is not finished yet.";
    return;
  }

  currentProfile=profile;
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");
  document.getElementById("userLabel").textContent=profile.username;

  const isOwner=profile.role==="owner";
  document.getElementById("ownerPanel").classList.toggle("hidden",!isOwner);
  await loadGames();
}

async function loadGames(){
  const area=document.getElementById("games");
  const message=document.getElementById("gamesMessage");
  area.innerHTML="";
  message.textContent="Loading games...";

  const {data,error}=await db.from("games")
    .select("id,title,url,image_url")
    .order("created_at",{ascending:false});

  if(error){message.textContent="Games database is not set up yet.";return;}
  if(!data.length){message.textContent="No games have been published yet.";return;}

  message.textContent="";
  data.forEach(game=>{
    const card=document.createElement("article");
    card.className="game";

    const img=document.createElement("img");
    img.src=game.image_url||"";
    img.alt=game.title+" cover";
    img.onerror=()=>{img.style.display="none";};

    const content=document.createElement("div");
    const title=document.createElement("h3");
    title.textContent=game.title;

    const link=document.createElement("a");
    link.href=game.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="Play game";
    link.style.color="#d8b4fe";

    content.append(title,link);
    card.append(img,content);
    area.append(card);
  });
}

async function publishGame(){
  if(currentProfile?.role!=="owner"){
    document.getElementById("ownerMessage").textContent="Owner access required.";
    return;
  }

  const title=document.getElementById("gameTitle").value.trim();
  const url=document.getElementById("gameUrl").value.trim();
  const image_url=document.getElementById("gameImage").value.trim();
  const message=document.getElementById("ownerMessage");

  if(!title||!url){message.textContent="Enter a game title and link.";return;}
  try{
    const parsed=new URL(url);
    if(!["https:","http:"].includes(parsed.protocol))throw new Error();
  }catch{
    message.textContent="Enter a valid game link starting with https://";
    return;
  }

  message.textContent="Publishing...";
  const {error}=await db.from("games").insert({
    title,url,image_url:image_url||null,
    created_by:currentUser.id
  });

  if(error){message.textContent=error.message;return;}
  message.textContent="Game published!";
  document.getElementById("gameTitle").value="";
  document.getElementById("gameUrl").value="";
  document.getElementById("gameImage").value="";
  await loadGames();
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_IN"&&session) loadApp();
});

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session) await loadApp();
})();
</script>
</body>
</html>
